<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Thought Processor</title>
    <script src="auth-manager.js"></script>
    <script src="mock-data.js"></script>
    <script src="api-service.js"></script>
    <link rel="stylesheet" href="summer-theme.css">
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <!-- Mock Mode Indicator -->
    <div id="mockModeIndicator"
        style="display: none; background: #ff9800; color: white; text-align: center; padding: 5px; font-size: 12px; font-weight: bold;">
        ⚠️ MOCK MODE ENABLED
        <button onclick="apiService.setMockMode(false)"
            style="margin-left: 10px; font-size: 10px; padding: 2px 5px;">Switch to Real API</button>
    </div>

    <!-- Modern Clean Header -->
    <div class="header-row">
        <div class="app-title">
            <span class="icon">💭</span>
            <span>AI Thought Processor</span>
        </div>

        <div class="header-stats">
            <div class="mini-stat">
                <div class="mini-stat-label">Anxiety</div>
                <div class="mini-stat-value" id="anxietyLevel">0</div>
            </div>
            <div class="mini-stat">
                <div class="mini-stat-label">Critical</div>
                <div class="mini-stat-value" id="criticalCount">0</div>
            </div>
            <div class="mini-stat">
                <div class="mini-stat-label">Clarity</div>
                <div class="mini-stat-value" id="clarityScore">0%</div>
            </div>
        </div>

        <div class="user-menu">
            <span class="user-email" id="userEmail"></span>
            <a href="search.html" class="btn-search">
                <span>🔍</span>
                <span>Search</span>
            </a>
            <a href="groups.html" class="btn-manage-groups">
                <span>👥</span>
                <span>Groups</span>
            </a>
            <button class="btn-logout" onclick="confirmLogout()">
                <span>Logout</span>
            </button>
        </div>
    </div>

    <div class="container">
        <!-- Anonymous Banner (if applicable) -->
        <div id="anonymousBanner" style="display: none;">
            <!-- Will be populated by JS -->
        </div>

        <!-- Main Input Area - Centered and Prominent -->
        <div class="input-section">
            <div class="welcome-prompt">
                <h1>Process your thoughts with AI</h1>
                <p>Share what's on your mind and get intelligent insights</p>
            </div>

            <div class="input-container">
                <!-- Context Pills (Processing Mode) -->
                <div class="mode-selector">
                    <label class="mode-label">Context</label>
                    <div class="mode-options">
                        <label class="radio-option">
                            <input type="radio" name="processingMode" value="single" checked
                                onchange="toggleGroupSelector()">
                            <span>💭</span>
                            <span>Personal Feedback</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="processingMode" value="group" onchange="toggleGroupSelector()">
                            <span>👥</span>
                            <span>Group Perspectives</span>
                        </label>
                    </div>

                    <!-- Group Selector (hidden by default) -->
                    <div class="group-selector" id="groupSelector">
                        <select id="selectedGroup">
                            <option value="">Select a persona group...</option>
                            <!-- Options populated dynamically -->
                        </select>
                        <div class="group-info">
                            <span class="icon">ℹ️</span>
                            <span>No groups yet? <button onclick="showQuickCreateModal()" class="manage-groups-link"
                                    style="background: none; border: none; padding: 0; font: inherit; cursor: pointer;">Create
                                    one now</button> or <a href="groups.html" class="manage-groups-link">manage all
                                    groups</a></span>
                        </div>
                    </div>
                </div>

                <textarea id="thoughtText" class="main-textarea"
                    placeholder="What's on your mind? Share your thoughts, ideas, or questions and let AI help you process them..."
                    maxlength="2000" oninput="updateCharCount()"></textarea>

                <div class="input-actions">
                    <div class="action-left">
                        <button class="action-btn" id="processBtnIcon" onclick="triggerProcess()"
                            title="Process all pending thoughts">
                            ⚡
                            <span class="badge" id="pendingBadge" style="display: none;">0</span>
                        </button>
                        <span class="char-count" id="charCount">0 / 2000</span>
                    </div>

                    <button class="action-btn submit-btn" id="submitBtn" onclick="submitThought()"
                        title="Submit thought">
                        ↑
                    </button>
                </div>
            </div>

            <!-- Status Messages -->
            <div id="submitStatus" class="status-message"></div>
            <div id="processStatus" class="status-message"></div>
        </div>

        <!-- Filters Section -->
        <div class="filters-section">
            <div class="filters-header">
                <h2 class="section-title">All Thoughts</h2>
                <button class="btn-reset" onclick="resetFilters()">Reset</button>
            </div>

            <div class="filter-grid">
                <select id="filterStatus" class="filter-select" onchange="applyFilters()">
                    <option value="all">All Status</option>
                    <option value="completed">Completed</option>
                    <option value="pending">Pending</option>
                    <option value="processing">Processing</option>
                    <option value="failed">Failed</option>
                </select>

                <select id="filterPriority" class="filter-select" onchange="applyFilters()">
                    <option value="all">All Priorities</option>
                    <option value="critical">Critical</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>

                <select id="filterCategory" class="filter-select" onchange="applyFilters()">
                    <option value="all">All Categories</option>
                    <option value="idea">Idea</option>
                    <option value="question">Question</option>
                    <option value="concern">Concern</option>
                    <option value="observation">Observation</option>
                    <option value="reflection">Reflection</option>
                </select>

                <select id="sortBy" class="filter-select" onchange="applyFilters()">
                    <option value="created_desc">Newest First</option>
                    <option value="created_asc">Oldest First</option>
                    <option value="priority_desc">Priority (High-Low)</option>
                    <option value="value_desc">Value (High-Low)</option>
                </select>
            </div>
        </div>

        <!-- Thoughts List -->
        <div class="thoughts-section">
            <div class="thoughts-header">
                <span class="thought-count" id="thoughtCount">0 thoughts</span>
            </div>

            <div id="thoughtsList" class="thoughts-list">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading thoughts...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check for mock mode and update UI
        document.addEventListener('DOMContentLoaded', () => {
            if (apiService.useMock) {
                document.getElementById('mockModeIndicator').style.display = 'block';
            }
        });

        // Initialize state
        let allThoughts = [];
        let eventSource = null;
        let isAnonymous = false;
        let remainingThoughts = 3;

        // Character count update
        function updateCharCount() {
            const textarea = document.getElementById('thoughtText');
            const charCount = document.getElementById('charCount');
            charCount.textContent = `${textarea.value.length} / 2000`;
        }

        // Toggle group selector visibility
        function toggleGroupSelector() {
            const groupSelector = document.getElementById('groupSelector');
            const selectedMode = document.querySelector('input[name="processingMode"]:checked').value;

            if (selectedMode === 'group') {
                groupSelector.classList.add('show');
            } else {
                groupSelector.classList.remove('show');
            }
        }

        // Load persona groups for dropdown
        async function loadPersonaGroups() {
            if (isAnonymous) {
                // Anonymous users can't use groups
                return;
            }

            try {
                const userId = getUserId();
                if (!userId) return;

                const response = await fetch(`${API_BASE}/groups?user_id=${userId}&include_personas=true`, {
                    headers: getAuthHeaders()
                });

                if (response.ok) {
                    const data = await response.json();
                    const select = document.getElementById('selectedGroup');

                    // Clear existing options except the first one
                    select.innerHTML = '<option value="">Select a persona group...</option>';

                    if (data.groups && data.groups.length > 0) {
                        data.groups.forEach(group => {
                            const option = document.createElement('option');
                            option.value = group.id;
                            const personaCount = group.personas ? group.personas.length : 0;
                            option.textContent = `${group.name} (${personaCount} persona${personaCount !== 1 ? 's' : ''})`;
                            select.appendChild(option);
                        });

                        // Update info message
                        const groupInfo = select.parentElement.querySelector('.group-info');
                        groupInfo.innerHTML = `
                            <span class="icon">ℹ️</span>
                            <span>Manage your groups: <a href="groups.html" class="manage-groups-link">Go to Groups</a></span>
                        `;
                    } else {
                        // No groups yet
                        const groupInfo = select.parentElement.querySelector('.group-info');
                        groupInfo.innerHTML = `
                            <span class="icon">ℹ️</span>
                            <span>No groups yet? <a href="groups.html" class="manage-groups-link">Create your first group</a></span>
                        `;
                    }
                }
            } catch (error) {
                console.error('Failed to load persona groups:', error);
            }
        }

        // Check if user is authenticated (using authManager)
        function checkAuth() {
            if (authManager.isAuthenticated()) {
                isAnonymous = false;
                return true;
            }

            // User is not authenticated, setup anonymous mode
            isAnonymous = true;
            setupAnonymousMode();
            return true;
        }

        // Setup anonymous user mode
        function setupAnonymousMode() {
            const sessionToken = authManager.getAnonymousSession();
            if (!sessionToken) {
                console.log('Anonymous mode: No session token yet');
            }

            const userEmailElement = document.getElementById('userEmail');
            if (userEmailElement) {
                userEmailElement.textContent = 'Anonymous (3 free)';
                userEmailElement.style.color = '#f59e0b';
                userEmailElement.style.display = 'block';
            }

            showAnonymousBanner();
        }

        // Show banner for anonymous users
        function showAnonymousBanner() {
            const banner = document.getElementById('anonymousBanner');
            banner.style.display = 'flex';
            banner.className = 'anonymous-banner';

            banner.innerHTML = `
                <span class="banner-text" id="anonymousBannerText">💭 Try 3 thoughts free! No signup required.</span>
                <button class="btn-signup" onclick="window.location.href='login.html?signup=true'">Sign Up for More</button>
            `;
        }

        // Update anonymous banner
        function updateAnonymousBanner(sessionInfo) {
            const bannerText = document.getElementById('anonymousBannerText');
            if (bannerText && sessionInfo) {
                const remaining = sessionInfo.thoughts_remaining;
                if (remaining === 0) {
                    bannerText.textContent = '🎉 You\'ve used all 3 free thoughts! Sign up to continue.';
                } else {
                    bannerText.textContent = `💭 ${remaining} free thought${remaining !== 1 ? 's' : ''} remaining.`;
                }
            }
        }

        // Show rate limit modal
        function showRateLimitModal() {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';

            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-icon">🎯</div>
                    <h2 class="modal-title">Ready for More Insights?</h2>
                    <p class="modal-text">
                        You've reached your limit of 3 free thoughts.<br>
                        Sign up now to unlock unlimited thought processing and AI-powered insights!
                    </p>
                    <div class="modal-actions">
                        <button class="btn-modal-primary" onclick="signupFromModal()">Sign Up Free</button>
                        <button class="btn-modal-secondary" onclick="loginFromModal()">I Have an Account</button>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);
        }

        function signupFromModal() {
            const sessionToken = localStorage.getItem('anonymous_session_token');
            localStorage.setItem('pending_conversion_token', sessionToken);
            window.location.href = 'login.html?signup=true';
        }

        function loginFromModal() {
            const sessionToken = localStorage.getItem('anonymous_session_token');
            localStorage.setItem('pending_conversion_token', sessionToken);
            window.location.href = 'login.html';
        }

        // Get authentication headers (using authManager)
        function getAuthHeaders() {
            return authManager.getAuthHeaders();
        }

        // Get or create user ID (using authManager)
        function getUserId() {
            const userId = authManager.getUserId();
            if (!userId && !isAnonymous) {
                authManager.logout('User ID not found');
                return null;
            }
            return userId;
        }

        // Handle logout (using authManager)
        function logout() {
            authManager.logout();
        }

        // Confirm logout
        function confirmLogout() {
            if (confirm('Are you sure you want to logout?')) {
                logout();
            }
        }

        // Show status message
        function showStatus(elementId, message, type) {
            const statusDiv = document.getElementById(elementId);
            statusDiv.textContent = message;
            statusDiv.className = `status-message ${type} show`;

            setTimeout(() => {
                statusDiv.classList.remove('show');
            }, 5000);
        }

        // Submit thought
        async function submitThought() {
            const thoughtText = document.getElementById('thoughtText').value;

            if (!thoughtText || !thoughtText.trim()) {
                showStatus('submitStatus', '❌ Please enter a thought', 'error');
                return;
            }

            // Get processing mode and group
            const processingMode = document.querySelector('input[name="processingMode"]:checked').value;
            const groupId = processingMode === 'group' ? document.getElementById('selectedGroup').value : null;

            // Validate group selection for group mode
            if (processingMode === 'group' && !groupId) {
                showStatus('submitStatus', '❌ Please select a persona group', 'error');
                return;
            }

            try {
                if (isAnonymous) {
                    // Anonymous users can only use single mode
                    const sessionToken = localStorage.getItem('anonymous_session_token');

                    const response = await fetch(`${API_BASE}/anonymous/thoughts`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text: thoughtText,
                            session_token: sessionToken
                        })
                    });

                    if (response.status === 429) {
                        showStatus('submitStatus', '🚀 You\'ve reached your limit! Sign up to continue.', 'error');
                        showRateLimitModal();
                        return;
                    }

                    if (response.ok) {
                        const data = await response.json();

                        if (data.session_info && data.session_info.session_token) {
                            localStorage.setItem('anonymous_session_token', data.session_info.session_token);
                            anonymousSessionInfo = data.session_info;
                            updateAnonymousBanner(data.session_info);
                        }

                        const remaining = data.session_info?.thoughts_remaining || 0;
                        showStatus('submitStatus', `✅ Thought submitted! ${remaining} free thought${remaining !== 1 ? 's' : ''} remaining.`, 'success');
                        document.getElementById('thoughtText').value = '';
                        updateCharCount();
                        setTimeout(() => loadThoughts(), 1000);

                        if (remaining === 0) {
                            setTimeout(() => showRateLimitModal(), 2000);
                        }
                    } else {
                        throw new Error('Failed to submit');
                    }
                } else {
                    const userId = getUserId();
                    if (!userId) return;

                    // Build request body with processing mode
                    const requestBody = {
                        user_id: userId,
                        text: thoughtText,
                        processing_mode: processingMode
                    };

                    if (groupId) {
                        requestBody.group_id = groupId;
                    }

                    const response = await fetch(`${API_BASE}/thoughts`, {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: JSON.stringify(requestBody)
                    });

                    if (response.status === 401) {
                        logout();
                        return;
                    }

                    if (response.ok) {
                        const successMessage = processingMode === 'group'
                            ? '✅ Thought submitted! Processing with your group personas...'
                            : '✅ Thought submitted successfully!';
                        showStatus('submitStatus', successMessage, 'success');
                        document.getElementById('thoughtText').value = '';
                        updateCharCount();
                        setTimeout(() => loadThoughts(), 1000);
                    } else {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.detail || 'Failed to submit');
                    }
                }
            } catch (error) {
                showStatus('submitStatus', `❌ ${error.message}`, 'error');
            }
        }

        // Trigger batch processing
        async function triggerProcess() {
            showStatus('processStatus', '⚙️ Triggering batch processor...', 'info');

            try {
                const response = await fetch(`${API_BASE}/process/trigger`, {
                    method: 'POST',
                    headers: getAuthHeaders()
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                if (response.ok) {
                    showStatus('processStatus', '✅ Processing started! Thoughts will be analyzed.', 'success');
                    setTimeout(() => loadThoughts(), 2000);
                } else {
                    throw new Error('Failed to trigger');
                }
            } catch (error) {
                showStatus('processStatus', '❌ Failed to trigger processing.', 'error');
            }
        }

        // Load thoughts
        async function loadThoughts() {
            try {
                let response;

                if (isAnonymous) {
                    const sessionToken = localStorage.getItem('anonymous_session_token');
                    if (!sessionToken) {
                        allThoughts = [];
                        updateDashboard();
                        applyFilters();
                        return;
                    }

                    response = await fetch(`${API_BASE}/anonymous/thoughts/${sessionToken}`, {
                        headers: { 'Content-Type': 'application/json' }
                    });

                    if (!response.ok) {
                        allThoughts = [];
                        updateDashboard();
                        applyFilters();
                        return;
                    }
                } else {
                    const userId = getUserId();
                    if (!userId) return;

                    response = await fetch(`${API_BASE}/thoughts/${userId}`, {
                        headers: getAuthHeaders()
                    });

                    if (response.status === 401) {
                        logout();
                        return;
                    }
                }

                const data = await response.json();
                allThoughts = data.thoughts || [];

                updateDashboard();
                applyFilters();
            } catch (error) {
                console.error('Error loading thoughts:', error);
                document.getElementById('thoughtsList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <p class="empty-text">Failed to load thoughts</p>
                        <p class="empty-subtext">Please check your connection</p>
                    </div>
                `;
            }
        }

        // Update dashboard stats
        function updateDashboard() {
            const completed = allThoughts.filter(t => t.status === 'completed');
            const pending = allThoughts.filter(t => t.status === 'pending');

            // Anxiety Level
            const anxietyKeywords = ['stress', 'worry', 'anxious', 'nervous', 'overwhelm', 'panic', 'fear'];
            const anxiousThoughts = completed.filter(t => {
                const urgency = t.classification?.urgency || '';
                const tone = t.classification?.emotional_tone || '';
                const isHighUrgency = urgency === 'high' || urgency === 'immediate';
                const isAnxiousTone = anxietyKeywords.some(kw => tone.toLowerCase().includes(kw));
                return isHighUrgency || isAnxiousTone;
            });
            const anxietyLevel = anxiousThoughts.length;
            document.getElementById('anxietyLevel').textContent = anxietyLevel;

            // Critical Count
            const criticalThoughts = allThoughts.filter(t => {
                const priorityLevel = t.priority?.priority_level?.toLowerCase() || '';
                return priorityLevel === 'critical' || priorityLevel === 'high';
            });
            document.getElementById('criticalCount').textContent = criticalThoughts.length;

            // Mental Clarity
            const nonEssentialThoughts = completed.filter(t => {
                const priorityLevel = t.priority?.priority_level?.toLowerCase() || '';
                const weightedTotal = t.value_impact?.weighted_total || 0;
                return priorityLevel === 'defer' || weightedTotal === 0;
            });
            const essentialPercentage = completed.length > 0
                ? Math.round(((completed.length - nonEssentialThoughts.length) / completed.length) * 100)
                : 0;
            document.getElementById('clarityScore').textContent = essentialPercentage + '%';

            // Update pending badge
            const pendingBadge = document.getElementById('pendingBadge');
            if (pending.length > 0) {
                pendingBadge.textContent = pending.length;
                pendingBadge.style.display = 'flex';
            } else {
                pendingBadge.style.display = 'none';
            }
        }

        // Apply filters
        function applyFilters() {
            const status = document.getElementById('filterStatus').value;
            const priority = document.getElementById('filterPriority').value;
            const category = document.getElementById('filterCategory').value;
            const sortBy = document.getElementById('sortBy').value;

            let filtered = [...allThoughts];

            if (status !== 'all') {
                filtered = filtered.filter(t => t.status === status);
            }
            if (priority !== 'all') {
                filtered = filtered.filter(t => {
                    const priorityLevel = t.priority?.priority_level?.toLowerCase() || '';
                    return priorityLevel === priority.toLowerCase();
                });
            }
            if (category !== 'all') {
                filtered = filtered.filter(t => t.classification?.type === category);
            }

            filtered.sort((a, b) => {
                switch (sortBy) {
                    case 'created_desc':
                        return new Date(b.created_at) - new Date(a.created_at);
                    case 'created_asc':
                        return new Date(a.created_at) - new Date(b.created_at);
                    case 'priority_desc':
                        const priOrder = { critical: 4, high: 3, medium: 2, low: 1, defer: 0 };
                        const aPri = (a.priority?.priority_level?.toLowerCase() || 'defer');
                        const bPri = (b.priority?.priority_level?.toLowerCase() || 'defer');
                        return (priOrder[bPri] || 0) - (priOrder[aPri] || 0);
                    case 'value_desc':
                        return (b.analysis?.value_score || 0) - (a.analysis?.value_score || 0);
                    default:
                        return 0;
                }
            });

            displayThoughts(filtered);
        }

        // Reset filters
        function resetFilters() {
            document.getElementById('filterStatus').value = 'all';
            document.getElementById('filterPriority').value = 'all';
            document.getElementById('filterCategory').value = 'all';
            document.getElementById('sortBy').value = 'created_desc';
            applyFilters();
        }

        // Display thoughts
        function displayThoughts(thoughts) {
            const container = document.getElementById('thoughtsList');
            document.getElementById('thoughtCount').textContent = `${thoughts.length} thought${thoughts.length !== 1 ? 's' : ''}`;

            if (thoughts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">💭</div>
                        <p class="empty-text">No thoughts found</p>
                        <p class="empty-subtext">Try adjusting your filters or submit a new thought</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = thoughts.map(thought => {
                const analysis = thought.analysis || {};
                const classification = thought.classification || {};
                const priorityLevel = (thought.priority?.priority_level || '').toLowerCase();
                const valueScore = analysis.value_score || 0;

                return `
                    <div class="thought-card ${thought.status}" onclick="viewDetails('${thought.user_id}', '${thought.id}')">
                        <div class="thought-card-header">
                            <span class="status-badge ${thought.status}">${thought.status}</span>
                            ${priorityLevel ? `<span class="priority-badge ${priorityLevel}">${priorityLevel}</span>` : ''}
                        </div>
                        <div class="thought-text">${thought.text}</div>
                        <div class="thought-meta">
                            <div class="meta-item">📅 ${new Date(thought.created_at).toLocaleDateString()}</div>
                            ${classification.type ? `<div class="meta-item">🏷️ ${classification.type}</div>` : ''}
                            ${valueScore > 0 ? `<span class="value-badge">💎 ${valueScore}/10</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function viewDetails(userId, thoughtId) {
            window.location.href = `detail.html?user_id=${userId}&thought_id=${thoughtId}`;
        }

        // Show toast notification
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideInRight 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // SSE Connection (for authenticated users only)
        function connectSSE() {
            if (isAnonymous) return;

            const userId = getUserId();
            if (!userId) return;

            const token = localStorage.getItem('auth_token');
            if (!token) return;

            try {
                const url = `${API_BASE}/events/${userId}?token=${encodeURIComponent(token)}`;
                eventSource = new EventSource(url);

                eventSource.onopen = function () {
                    console.log('✅ SSE Connected');
                    reconnectAttempts = 0;
                };

                eventSource.addEventListener('thought_created', function (e) {
                    loadThoughts();
                    showToast('Thought created!', 'info');
                });

                eventSource.addEventListener('thought_processing', function (e) {
                    showToast('AI analysis started...', 'info');
                });

                eventSource.addEventListener('group_processing_started', function (e) {
                    const data = JSON.parse(e.data);
                    showToast(`Processing with ${data.persona_count} personas...`, 'info');
                });

                eventSource.addEventListener('persona_completed', function (e) {
                    const data = JSON.parse(e.data);
                    showToast(`${data.persona_name} completed (${data.progress})`, 'info');
                });

                eventSource.addEventListener('consolidation_started', function (e) {
                    showToast('Synthesizing perspectives...', 'info');
                });

                eventSource.addEventListener('thought_completed', function (e) {
                    loadThoughts();
                    showToast('Analysis complete!', 'success');
                });

                eventSource.addEventListener('thought_failed', function (e) {
                    loadThoughts();
                    showToast('Analysis failed', 'error');
                });

                eventSource.onerror = function (error) {
                    console.error('SSE error:', error);
                    eventSource.close();

                    if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                        reconnectAttempts++;
                        const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                        reconnectTimeout = setTimeout(() => connectSSE(), delay);
                    }
                };

            } catch (error) {
                console.error('Failed to create SSE connection:', error);
            }
        }

        // Check authentication on page load
        if (!checkAuth()) {
            // Setup anonymous or authenticated mode
        } else {
            if (!isAnonymous) {
                const userEmail = localStorage.getItem('user_email');
                if (userEmail) {
                    document.getElementById('userEmail').textContent = userEmail;
                    document.getElementById('userEmail').style.display = 'block';
                }
                // Load persona groups for authenticated users
                loadPersonaGroups();
            }
        }

        // Initialize
        loadThoughts();

        if (!isAnonymous) {
            connectSSE();
        } else {
            setInterval(loadThoughts, 15000);
        }

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (eventSource) eventSource.close();
        });

        // ============================================================================
        // Inline Group Creation
        // ============================================================================

        let tempPersonas = [];

        function showQuickCreateModal() {
            tempPersonas = [];
            const modal = document.createElement('div');
            modal.className = 'inline-modal-overlay';
            modal.id = 'quickCreateModal';
            modal.innerHTML = `
                <div class="inline-modal">
                    <div class="inline-modal-header">
                        <h2 class="inline-modal-title">🎯 Quick Create Persona Group</h2>
                        <button class="modal-close-btn" onclick="closeQuickCreateModal()">✕</button>
                    </div>

                    <div class="modal-form-group">
                        <label class="modal-label">Group Name *</label>
                        <input type="text" id="quickGroupName" class="modal-input" placeholder="e.g., Career Advisory Board" maxlength="100" required>
                        <div class="modal-hint">A descriptive name for your persona group</div>
                    </div>

                    <div class="modal-form-group">
                        <label class="modal-label">Description (optional)</label>
                        <textarea id="quickGroupDescription" class="modal-textarea" placeholder="What is this group for?" maxlength="500"></textarea>
                    </div>

                    <div class="personas-builder">
                        <div class="personas-builder-header">
                            <span class="personas-builder-title">Personas (<span id="personaCount">0</span>/10)</span>
                            <button class="btn-add-persona" onclick="addPersonaToBuilder()" id="btnAddPersona">+ Add Persona</button>
                        </div>
                        <div id="personasList">
                            <div class="empty-personas">
                                👤 No personas yet. Add at least one persona to continue.
                            </div>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button class="btn-modal-cancel" onclick="closeQuickCreateModal()">Cancel</button>
                        <button class="btn-modal-submit" onclick="submitQuickCreate()" id="btnQuickSubmit" disabled>Create Group & Use It</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            // Add first persona by default
            setTimeout(() => addPersonaToBuilder(), 100);
        }

        function closeQuickCreateModal() {
            const modal = document.getElementById('quickCreateModal');
            if (modal) {
                modal.style.animation = 'fadeIn 0.2s ease reverse';
                setTimeout(() => modal.remove(), 200);
            }
            tempPersonas = [];
        }

        function addPersonaToBuilder() {
            if (tempPersonas.length >= 10) {
                showToast('Maximum 10 personas per group', 'error');
                return;
            }

            const personaId = Date.now();
            tempPersonas.push({ id: personaId, name: '', prompt: '' });
            renderPersonasList();
            updatePersonaCount();
        }

        function removePersonaFromBuilder(personaId) {
            tempPersonas = tempPersonas.filter(p => p.id !== personaId);
            renderPersonasList();
            updatePersonaCount();
        }

        function renderPersonasList() {
            const container = document.getElementById('personasList');

            if (tempPersonas.length === 0) {
                container.innerHTML = '<div class="empty-personas">👤 No personas yet. Add at least one persona to continue.</div>';
                return;
            }

            container.innerHTML = tempPersonas.map((persona, index) => `
                <div class="persona-item" data-persona-id="${persona.id}">
                    <div class="persona-item-header">
                        <span class="persona-number">Persona ${index + 1}</span>
                        <button class="btn-remove-persona" onclick="removePersonaFromBuilder(${persona.id})">Remove</button>
                    </div>
                    <div class="modal-form-group">
                        <label class="modal-label">Name *</label>
                        <input 
                            type="text" 
                            class="modal-input" 
                            placeholder="e.g., Pragmatic Tech Lead" 
                            maxlength="100"
                            value="${persona.name}"
                            onchange="updatePersonaField(${persona.id}, 'name', this.value)"
                            required
                        >
                    </div>
                    <div class="modal-form-group">
                        <label class="modal-label">Persona Prompt *</label>
                        <textarea 
                            class="modal-textarea" 
                            placeholder="You are a senior technical leader focused on scalability and maintainability..." 
                            maxlength="2000"
                            onchange="updatePersonaField(${persona.id}, 'prompt', this.value)"
                            required
                        >${persona.prompt}</textarea>
                        <div class="modal-hint">Describe the persona's role, perspective, and focus areas</div>
                    </div>
                </div>
            `).join('');
        }

        function updatePersonaField(personaId, field, value) {
            const persona = tempPersonas.find(p => p.id === personaId);
            if (persona) {
                persona[field] = value;
                validateQuickCreateForm();
            }
        }

        function updatePersonaCount() {
            const countEl = document.getElementById('personaCount');
            const addBtn = document.getElementById('btnAddPersona');

            if (countEl) countEl.textContent = tempPersonas.length;
            if (addBtn) addBtn.disabled = tempPersonas.length >= 10;

            validateQuickCreateForm();
        }

        function validateQuickCreateForm() {
            const groupName = document.getElementById('quickGroupName')?.value.trim();
            const submitBtn = document.getElementById('btnQuickSubmit');

            // Check if group name exists and at least one persona is complete
            const hasValidPersonas = tempPersonas.length > 0 &&
                tempPersonas.every(p => p.name.trim() && p.prompt.trim());

            const isValid = groupName && hasValidPersonas;

            if (submitBtn) {
                submitBtn.disabled = !isValid;
            }
        }

        async function submitQuickCreate() {
            const groupName = document.getElementById('quickGroupName').value.trim();
            const groupDescription = document.getElementById('quickGroupDescription').value.trim();
            const userId = getUserId();

            if (!groupName) {
                showToast('Please enter a group name', 'error');
                return;
            }

            if (tempPersonas.length === 0) {
                showToast('Please add at least one persona', 'error');
                return;
            }

            const invalidPersonas = tempPersonas.filter(p => !p.name.trim() || !p.prompt.trim());
            if (invalidPersonas.length > 0) {
                showToast('Please complete all persona fields', 'error');
                return;
            }

            const submitBtn = document.getElementById('btnQuickSubmit');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';

            try {
                // Create the group
                const groupResponse = await fetch(`${API_BASE}/groups?user_id=${userId}`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        name: groupName,
                        description: groupDescription || null
                    })
                });

                if (!groupResponse.ok) {
                    const error = await groupResponse.json();
                    throw new Error(error.detail || 'Failed to create group');
                }

                const group = await groupResponse.json();

                // Create all personas
                for (const persona of tempPersonas) {
                    const personaResponse = await fetch(`${API_BASE}/groups/${group.id}/personas`, {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: JSON.stringify({
                            name: persona.name.trim(),
                            prompt: persona.prompt.trim()
                        })
                    });

                    if (!personaResponse.ok) {
                        throw new Error(`Failed to create persona: ${persona.name}`);
                    }
                }

                showToast(`Group "${groupName}" created with ${tempPersonas.length} persona(s)!`, 'success');

                // Reload persona groups dropdown
                await loadPersonaGroups();

                // Auto-select the new group
                const groupSelector = document.getElementById('selectedGroup');
                if (groupSelector) {
                    groupSelector.value = group.id;
                }

                closeQuickCreateModal();

            } catch (error) {
                console.error('Error creating group:', error);
                showToast(error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Group & Use It';
            }
        }

        // Add event listeners for form validation
        document.addEventListener('input', (e) => {
            if (e.target.id === 'quickGroupName' ||
                e.target.classList.contains('modal-input') ||
                e.target.classList.contains('modal-textarea')) {
                validateQuickCreateForm();
            }
        });
    </script>
</body>

</html>
